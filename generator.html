<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Permanent QR Generator</title><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#070a12;color:#f7f8fb;font-family:system-ui;padding:30px}.box{max-width:850px;margin:auto;background:#121827;border:1px solid #ffffff16;border-radius:24px;padding:25px}h1{margin-top:0}label{display:block;margin:16px 0 7px;color:#aeb9ca;font-size:13px;font-weight:700}input,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid #ffffff16;background:#090d16;color:white;font:inherit;outline:none}textarea{min-height:150px;resize:vertical}button{margin-top:16px;padding:13px 17px;border:0;border-radius:12px;background:#7357ff;color:#fff;font-weight:700;cursor:pointer}.result{display:grid;grid-template-columns:300px 1fr;gap:25px;margin-top:25px;align-items:start}#qr{background:white;padding:10px;border-radius:14px;width:max-content;min-height:220px;min-width:220px}.url{word-break:break-all;color:#9faabd;line-height:1.5}small{color:#758096}@media(max-width:650px){.result{grid-template-columns:1fr}#qr{margin:auto}}</style></head><body><div class="box"><h1>Permanent QR Generator</h1><small>Creates a QR pointing to your hosted frontend. The QR itself never expires; the published site controls the displayed text.</small><label>Published note ID</label><input id="id" value="welcome" placeholder="e.g. door-01"><label>Title</label><input id="title" value="Welcome"><label>Text / statement</label><textarea id="text">This is your permanent QR note.</textarea><label>Your deployed domain</label><input id="domain" value="https://trd8468-png.github.io/qrtex" placeholder="https://example.netlify.app"><button onclick="makeQR()">Generate QR</button><div class="result"><div id="qr"></div><div><p class="url" id="url">Your permanent URL will appear here.</p><button onclick="downloadQR()">Download QR</button><p><small>Publish the same ID/title/text in <b>notes.js</b> before deployment.</small></p></div></div></div><script>function makeQR(){const id=document.getElementById("id").value.trim().toLowerCase().replace(/[^a-z0-9_-]/g,"-"),d=document.getElementById("domain").value.trim().replace(/\/+$/,"");if(!id||!d)return alert("Enter note ID and deployed domain");const u=d+"/n/"+encodeURIComponent(id);document.getElementById("qr").innerHTML="";new QRCode(document.getElementById("qr"),{text:u,width:280,height:280,colorDark:"#000",colorLight:"#fff",correctLevel:QRCode.CorrectLevel.H});document.getElementById("url").textContent=u}function downloadQR(){const b=document.getElementById("qr"),c=b.querySelector("canvas"),i=b.querySelector("img");if(!c&&!i)return alert("Generate a QR first");const a=document.createElement("a");a.download="permanent-qr.png";a.href=c?c.toDataURL("image/png"):i.src;a.click()}</script></body></html>
