<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070a12"><title>Permanent Note</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#070a12;color:#f7f8fb;display:grid;place-items:center;padding:24px}.wrap{width:min(720px,100%)}.brand{text-align:center;color:#8e9aaf;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:18px}.card{background:#121827e8;border:1px solid #ffffff1a;border-radius:28px;padding:34px;box-shadow:0 24px 80px #0008}.pill{display:inline-flex;padding:7px 11px;border-radius:999px;background:#ffffff0b;border:1px solid #ffffff12;color:#aeb9ca;font-size:12px}h1{font-size:clamp(28px,7vw,48px);line-height:1.08;letter-spacing:-1.5px;margin:18px 0 12px}.text{white-space:pre-wrap;word-break:break-word;font-size:clamp(18px,3vw,24px);line-height:1.65;color:#e9edf5}.meta{margin-top:26px;padding-top:18px;border-top:1px solid #ffffff0d;color:#778298;font-size:12px}.error{text-align:center}.error h1{font-size:34px}.error p{color:#929caf;line-height:1.6}</style></head><body><div class="wrap"><div class="brand">Permanent QR Note</div><main id="app"></main></div><script src="/notes.js"></script><script>(function(){const a=document.getElementById("app"),p=location.pathname.replace(/\/+$/,""),m=p.match(/^\/n\/([^/]+)$/i),id=m?decodeURIComponent(m[1]).toLowerCase():null,n=id&&window.NOTES?window.NOTES[id]:null;if(!n){a.innerHTML='<section class="card error"><span class="pill">Permanent QR Note</span><h1>Note not found</h1><p>This QR destination does not have a published note, or the address is incorrect.</p></section>';return}document.title=(n.title||"Your message")+" • Permanent QR Note";a.innerHTML='<section class="card"><span class="pill">Permanent • No Expiry</span><h1></h1><div class="text"></div><div class="meta">This message is served from the permanent QR destination.</div></section>';a.querySelector("h1").textContent=n.title||"Your message";a.querySelector(".text").textContent=n.text||""})()</script></body></html>
